name: The_hUB — Python foundation and isolation checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - '*.py'
      - 'automation/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'README.foundation-repair.md'

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: 'latest-known'
          enable-cache: true
      - name: Ensure Python 3.11
        run: uv python install 3.11
      - name: Validate existing dependency lock
        run: uv sync --locked --python 3.11
      - name: Syntax and base imports (exclude .venv)
        run: |
          uv run --no-sync python -m compileall -q -x '(^|/)(\.venv|\.git)/' .
          uv run --no-sync python -c "import sys, streamlit, pandas, numpy, plotly, sqlalchemy; print('Python', sys.version.split()[0], '- base imports OK')"
      - name: Verify SQLite explicit-memory connection
        env:
          DATABASE_URL: 'sqlite:///:memory:'
        run: |
          uv run --no-sync python - <<'PY'
          from sqlalchemy import text
          from database import engine
          with engine.connect() as connection:
              assert connection.scalar(text("SELECT 1")) == 1
          print("SQLite explicit connection OK")
          PY
      - name: Verify SQLite fallback when DATABASE_URL absent
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cd "$sandbox"
          env -u DATABASE_URL PYTHONPATH="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from pathlib import Path
          from sqlalchemy import text
          from database import engine, create_tables
          assert str(engine.url) == "sqlite:///voi_jeans.db"
          create_tables()
          with engine.connect() as connection:
              assert connection.scalar(text("SELECT 1")) == 1
          assert Path("voi_jeans.db").exists()
          print("SQLite unset-env fallback in disposable sandbox OK")
          PY
      - name: Streamlit synthetic-demo first render on disposable SQLite database
        env:
          THE_HUB_DEMO_MODE: '1'
          THE_HUB_ALLOW_SAMPLE_SEED: '1'
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cd "$sandbox"
          export DATABASE_URL="sqlite:///$sandbox/smoke.db"
          PYTHONPATH="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          from pathlib import Path
          import os
          from streamlit.testing.v1 import AppTest
          app_path = Path(os.environ["GITHUB_WORKSPACE"]) / "app.py"
          app = AppTest.from_file(str(app_path), default_timeout=35).run()
          errors = [str(item.message) for item in app.exception]
          assert not errors, "Streamlit first render raised: " + "; ".join(errors[:3])
          assert Path("smoke.db").exists(), "Expected only disposable SQLite database"
          print("Streamlit first render OK using disposable SQLite")
          PY
      - name: Verify app startup does not seed sample data
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cd "$sandbox"
          export DATABASE_URL="sqlite:///$sandbox/untouched.db"
          env -u THE_HUB_DEMO_MODE -u THE_HUB_ALLOW_SAMPLE_SEED PYTHONPATH="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python" - <<'PY'
          import os
          from pathlib import Path
          from streamlit.testing.v1 import AppTest
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "app.py"
          app = AppTest.from_file(str(source), default_timeout=35).run()
          assert not app.exception, [str(x.message) for x in app.exception]
          assert not Path("untouched.db").exists(), "Normal app startup unexpectedly wrote sample data"
          print("Normal app first render did not create any database")
          PY
      - name: Verify database-backed routes fail closed without demo setup
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cd "$sandbox"
          export DATABASE_URL="sqlite:///$sandbox/unseeded.db"
          env -u THE_HUB_DEMO_MODE -u THE_HUB_ALLOW_SAMPLE_SEED PYTHONPATH="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tests/smoke_unseeded_routes.py"
      - name: Demo navigation and identity-boundary smoke
        env:
          THE_HUB_DEMO_MODE: '1'
          THE_HUB_ALLOW_SAMPLE_SEED: '1'
        run: |
          sandbox=$(mktemp -d)
          trap 'rm -rf "$sandbox"' EXIT
          cd "$sandbox"
          export DATABASE_URL="sqlite:///$sandbox/demo.db"
          PYTHONPATH="$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/tests/smoke_demo_navigation.py"
      - name: Automation and sample-data policy unit tests
        run: uv run --no-sync python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Marketing non-sending preview smoke
        run: uv run --no-sync python -m automation.marketing_preview automation/marketing_campaigns.csv
