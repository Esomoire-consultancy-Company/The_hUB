name: Daily work — repository activity digest (review-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'automation/daily_github_digest.py'
      - '.github/workflows/daily-work-digest.yml'
  # No recurring schedule or recipient delivery until explicitly approved.

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  draft-digest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate GitHub source digest (no delivery)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m automation.daily_github_digest
