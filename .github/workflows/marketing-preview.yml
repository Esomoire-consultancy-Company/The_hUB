name: Marketing — review-only preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build non-sending campaign preview
        run: python automation/marketing_preview.py automation/marketing_campaigns.csv
